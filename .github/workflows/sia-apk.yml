# SIA - fabrique l'APK d'essai (debug, NON signé). Aucune clé ici : la signature se fait sur le PC de l'utilisateur.
# Déclenché par une étiquette essai-AAAAMMJJ-HHMM (APK normal) ou test-AAAAMMJJ-HHMM (variante TEST :
# captures et débogage WebView permis, même identifiant et même nom de fichier).
name: sia-apk
on:
  push:
    tags:
      - 'essai-*'
      - 'test-*'
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run verifier
      - run: npm run android
      - name: Fabriquer l'APK debug
        working-directory: android
        env:
          ETIQUETTE: ${{ github.ref_name }}
        run: |
          if [[ "$ETIQUETTE" == test-* ]]; then
            ./gradlew --no-daemon assembleDebug -PsiaTest=true
          else
            ./gradlew --no-daemon assembleDebug
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: sia-apk-non-signe
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
